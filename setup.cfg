[metadata]
name = slicer-package-manager
description = Manage Slicer application and extension packages.
long_description = file: README.rst
long_description_content_type = text/x-rst
author = Pierre Assemat, Jean-Christophe Fillion-Robin
author_email = jchris.fillionr@kitware.com
keywords = girder-plugin, slicer_package_manager
classifiers =
    Development Status :: 5 - Production/Stable
    License :: OSI Approved :: Apache Software License
    Natural Language :: English
    Programming Language :: Python :: 3

[options]
packages = find:
zip_safe = False
python_requires = >=3.7
install_requires =
    girder~=3.1.20
    girder-hashsum-download~=3.1.20
    html-sanitizer>=1.9.0
    lxml_html_clean

[options.packages.find]
include = slicer_package_manager*
exclude = tests*

[options.entry_points]
girder.plugin =
    slicer_package_manager = slicer_package_manager:GirderPlugin

[versioneer]
VCS = git
style = pep440-post
versionfile_source = slicer_package_manager/_version.py
versionfile_build = slicer_package_manager/_version.py
tag_prefix =
